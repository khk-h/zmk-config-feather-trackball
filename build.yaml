# GitHub Actions でビルドする組み合わせ（ボード＋シールド）
---
include:
  # 1台だけの机上試験
  - board: feather_nrf52840_zmk
    shield: trackball_test
  # 2台（左右の分割）の机上試験。右がセントラル（パソコンとつながる、トラックボール付き）
  - board: feather_nrf52840_zmk
    shield: trackball_test_split_left
  - board: feather_nrf52840_zmk
    shield: trackball_test_split_right
  # 保存されたペアリング情報などを消す（左右の組み合わせを変えたとき・つながらないときに書き込む）
  - board: feather_nrf52840_zmk
    shield: settings_reset
